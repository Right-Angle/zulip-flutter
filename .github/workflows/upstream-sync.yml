name: Upstream sync
# RA-fork: every 2 months (and on demand), rebase rightangle-chat onto
# upstream zulip/zulip-flutter main. If the rebase is clean and
# analyze+tests pass, force-push, tag <version>-raN, and push the tag —
# which triggers the Release workflow. Fully automatic update + release.
# On rebase conflicts or failing checks, nothing is pushed and an issue
# is opened for manual attention (see the runbook's manual path).
#
# The 2-month cadence keeps repo activity well inside GitHub's 60-day
# window, so this schedule never gets auto-disabled.
#
# Uses a PAT (secret SYNC_TOKEN), NOT the built-in GITHUB_TOKEN: pushing
# changes to .github/workflows/* (upstream's ci.yml, our workflows) is
# forbidden to GITHUB_TOKEN and requires a token with `workflow` scope.
# Because a PAT push DOES trigger other workflows, the tag push here
# fires Release directly — no explicit dispatch needed.

on:
  schedule:
    - cron: '23 5 1 1,3,5,7,9,11 *'   # 05:23 UTC, 1st of every odd month
  workflow_dispatch:

jobs:
  sync:
    name: "Rebase on upstream, test, release"
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: rightangle-chat
        fetch-depth: 0
        token: ${{ secrets.SYNC_TOKEN }}

    - name: Fetch upstream
      id: fetch
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote add upstream https://github.com/zulip/zulip-flutter.git
        git fetch upstream main
        git push origin upstream/main:refs/heads/main   # keep the mirror current
        if git merge-base --is-ancestor upstream/main HEAD; then
          echo "behind=false" >> "$GITHUB_OUTPUT"
          echo "Already up to date with upstream."
        else
          echo "behind=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Rebase onto upstream/main
      if: steps.fetch.outputs.behind == 'true'
      env:
        GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
      run: |
        if ! git rebase upstream/main; then
          git rebase --abort
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Upstream sync: rebase conflict ($(date -u +%Y-%m-%d))" \
            --body "Automatic rebase of rightangle-chat onto upstream/main hit conflicts. Run the manual rebase path in docs/rightangle/self-hosted-fcm.md."
          echo "Rebase conflicted; issue opened." >&2
          exit 1
        fi

    - name: Set up JDK
      if: steps.fetch.outputs.behind == 'true'
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: temurin

    - name: Clone Flutter SDK
      if: steps.fetch.outputs.behind == 'true'
      run: tools/ci/clone-flutter-sdk

    - name: Analyze and test
      if: steps.fetch.outputs.behind == 'true'
      env:
        GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
      run: |
        flutter pub get
        if ! { flutter analyze --no-pub && flutter test --no-pub; }; then
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Upstream sync: checks failed after rebase ($(date -u +%Y-%m-%d))" \
            --body "Rebase onto upstream/main was clean, but flutter analyze/test failed. Nothing was pushed. Investigate per docs/rightangle/self-hosted-fcm.md."
          echo "Checks failed; issue opened." >&2
          exit 1
        fi

    - name: Push and tag (tag push triggers Release)
      if: steps.fetch.outputs.behind == 'true'
      run: |
        git push --force-with-lease origin HEAD:rightangle-chat
        base=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
        git fetch --tags --quiet
        last=$(git tag -l "${base}-ra*" | sed 's/.*-ra//' | sort -n | tail -1)
        tag="${base}-ra$(( ${last:-0} + 1 ))"
        git tag "$tag"
        git push origin "$tag"
        echo "Pushed $tag; Release workflow will build and publish it."
